name: Upgrade public Trade flow

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Patch Trade flow
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/main.jsx')
          s = p.read_text(encoding='utf-8')

          old_import = 'import { WagmiProvider, useBalance, useSendTransaction, useWaitForTransactionReceipt } from "wagmi";'
          new_import = 'import { WagmiProvider, useBalance, useEstimateGas, useGasPrice, useSendTransaction, useSwitchChain, useWaitForTransactionReceipt } from "wagmi";'
          if old_import in s:
              s = s.replace(old_import, new_import, 1)

          new_trade = r'''function Trade() {
  const { address, isConnected } = useAppKitAccount();
  const { chainId } = useAppKitNetwork();
  const { switchChain, isPending: switching } = useSwitchChain();
  const goodNetwork = Number(chainId) === SEPOLIA_ID;
  const { data: balance, refetch } = useBalance({ address, chainId: SEPOLIA_ID, query: { enabled: Boolean(address) } });
  const { data: gasPrice } = useGasPrice({ chainId: SEPOLIA_ID });
  const { data: hash, error: sendError, isPending, sendTransactionAsync } = useSendTransaction();
  const { isLoading: confirming, isSuccess } = useWaitForTransactionReceipt({ hash, confirmations: 1 });
  const [amount, setAmount] = useState("");
  const [recipient, setRecipient] = useState("0x9BB4aBC72f2c4818F66C895Cd1a9de2c827C5C06");
  const [step, setStep] = useState("form");
  const [localError, setLocalError] = useState("");

  const validRecipient = isAddress(recipient.trim());
  const ethBalance = balance ? Number(formatEther(balance.value)) : 0;
  const parsedAmount = useMemo(() => {
    try { return amount && Number(amount) > 0 ? parseEther(amount) : 0n; } catch { return 0n; }
  }, [amount]);
  const estimatedGas = 21000n;
  const estimatedFee = gasPrice ? estimatedGas * gasPrice : 0n;
  const safetyReserve = parseEther("0.0002");
  const spendable = balance ? balance.value - estimatedFee - safetyReserve : 0n;
  const enough = parsedAmount > 0n && spendable > 0n && parsedAmount <= spendable;
  const amountText = parsedAmount > 0n ? Number(formatEther(parsedAmount)) : 0;
  const gasText = estimatedFee > 0n ? Number(formatEther(estimatedFee)) : 0.00042;
  const maxAmount = spendable > 0n ? Number(formatEther(spendable)) : 0;

  const validationMessage = !isConnected
    ? "Kết nối ví để tiếp tục."
    : !goodNetwork
      ? "Ví đang ở mạng khác. Hãy chuyển sang Ethereum Sepolia."
      : !validRecipient
        ? "Địa chỉ nhận không hợp lệ."
        : !parsedAmount
          ? "Nhập số lượng ETH lớn hơn 0."
          : !enough
            ? "Không đủ ETH sau khi dự phòng phí gas."
            : "";

  const setMax = () => {
    setLocalError("");
    setAmount(maxAmount > 0 ? maxAmount.toFixed(6) : "");
  };

  const review = () => {
    setLocalError("");
    if (validationMessage) { setLocalError(validationMessage); return; }
    setStep("review");
  };

  const send = async () => {
    setLocalError("");
    if (validationMessage) { setLocalError(validationMessage); return; }
    try {
      await sendTransactionAsync({ to: recipient.trim(), value: parsedAmount, chainId: SEPOLIA_ID });
      setStep("submitted");
      await refetch();
    } catch (e) {
      const message = e?.shortMessage || e?.message || "Giao dịch bị từ chối hoặc thất bại.";
      setLocalError(/reject|denied|user rejected|cancel/i.test(message) ? "Bạn đã từ chối giao dịch trong ví." : message);
    }
  };

  const reset = () => { setStep("form"); setLocalError(""); setAmount(""); };

  return <div className="page trade-page">
    <Header title="Trade" text="Sepolia ETH transfer • non-custodial • bạn tự kiểm tra và ký trong ví." action={<AppKitButton/>}/>
    <div className="trade-layout trade-complete">
      <div className="trade-box">
        <div className="trade-steps" aria-label="Trade steps">
          <span className={step === "form" ? "active" : "done"}>1. TRADE</span><span>→</span><span className={step === "review" ? "active" : step === "submitted" ? "done" : ""}>2. REVIEW</span><span>→</span><span className={step === "submitted" ? "active" : ""}>3. SIGN</span>
        </div>

        {step === "form" && <>
          <div className="trade-field">
            <div className="field-head"><label>From</label><span>Ethereum Sepolia</span></div>
            <div className="asset-select"><div className="asset-icon purple">E</div><div><strong>ETH</strong><small>Ethereum</small></div><div className="field-balance"><span>Balance</span><b>{balance ? `${ethBalance.toFixed(6)} ETH` : "—"}</b></div></div>
          </div>
          <div className="trade-field">
            <div className="field-head"><label>To</label><span className={validRecipient ? "field-ok" : "field-bad"}>{validRecipient ? "✓ Valid address" : "! Check address"}</span></div>
            <input className="recipient-input large-address-input" value={recipient} onChange={e => { setRecipient(e.target.value); setLocalError(""); }} placeholder="0x…" autoComplete="off" spellCheck="false"/>
          </div>
          <div className="trade-field">
            <div className="field-head"><label>Amount</label><button className="max-button" onClick={setMax} disabled={!isConnected || !goodNetwork || !balance}>MAX</button></div>
            <div className="amount-row"><input className="amount trade-amount" inputMode="decimal" value={amount} onChange={e => { setAmount(e.target.value.replace(/[^0-9.]/g, "")); setLocalError(""); }} placeholder="0.001"/><span>ETH</span></div>
            <div className="trade-hints"><span>Available: {balance ? `${ethBalance.toFixed(6)} ETH` : "—"}</span><span>Gas estimate: ≈ {gasText.toFixed(6)} ETH</span></div>
          </div>
          <div className="trade-network"><span>Network</span><strong>{goodNetwork ? "✓ Ethereum Sepolia" : "⚠ Wrong network"}</strong>{!goodNetwork && isConnected && <button onClick={() => switchChain?.({ chainId: SEPOLIA_ID })} disabled={switching}>{switching ? "Switching…" : "Switch to Sepolia"}</button>}</div>
          {localError && <div className="trade-error" role="alert">{localError}</div>}
          {!isConnected ? <AppKitButton/> : !goodNetwork ? <button className="primary-button" onClick={() => switchChain?.({ chainId: SEPOLIA_ID })} disabled={switching}>{switching ? "Đang chuyển mạng…" : "Switch to Sepolia"}</button> : <button className="primary-button" onClick={review} disabled={!validRecipient || !enough}>{"Review Trade →"}</button>}
        </>}

        {step === "review" && <div className="trade-review">
          <div className="review-badge">REVIEW BEFORE SIGNING</div>
          <h2>Confirm your trade</h2>
          <p>Kiểm tra kỹ địa chỉ và số lượng trước khi mở ví.</p>
          <div className="review-card"><div><span>From</span><b>{shorten(address)}</b></div><div><span>Asset</span><b>ETH • Sepolia</b></div><div><span>To</span><b className="mono">{shorten(recipient.trim())}</b></div><div><span>Amount</span><b>{amountText.toFixed(6)} ETH</b></div><div><span>Estimated gas</span><b>≈ {gasText.toFixed(6)} ETH</b></div><div className="review-total"><span>Estimated total</span><b>≈ {(amountText + gasText).toFixed(6)} ETH</b></div></div>
          {localError && <div className="trade-error" role="alert">{localError}</div>}
          <div className="review-actions"><button className="ghost-button" onClick={() => setStep("form")} disabled={isPending || confirming}>← Edit</button><button className="primary-button" onClick={send} disabled={isPending || confirming}>{isPending ? "Waiting for wallet…" : confirming ? "Confirming…" : "Confirm & Sign ↗"}</button></div>
        </div>}

        {step === "submitted" && <div className="trade-review trade-success">
          <div className="success-icon">✓</div><div className="review-badge">TRANSACTION SUBMITTED</div><h2>{isSuccess ? "Transaction confirmed" : confirming ? "Transaction pending" : "Transaction submitted"}</h2><p>{isSuccess ? "Giao dịch đã được xác nhận trên Ethereum Sepolia." : "Đang chờ mạng và ví hoàn tất giao dịch."}</p>
          {hash && <div className="hash-card"><span>Transaction hash</span><a href={`https://sepolia.etherscan.io/tx/${hash}`} target="_blank" rel="noreferrer">{hash}</a><small>↗ View on Sepolia Etherscan</small></div>}
          {sendError && <div className="trade-error" role="alert">{sendError.shortMessage || "Giao dịch thất bại."}</div>}
          <button className="primary-button" onClick={reset}>New Trade</button>
        </div>}
      </div>

      <aside className="checks trade-side">
        <div className="side-title">TRADE STATUS</div>
        <div className="check"><span className={isConnected ? "check-good" : "check-bad"}>{isConnected ? "✓" : "!"}</span><div><b>Wallet</b><small>{isConnected ? shorten(address) : "Not connected"}</small></div></div>
        <div className="check"><span className={goodNetwork ? "check-good" : "check-bad"}>{goodNetwork ? "✓" : "!"}</span><div><b>Network</b><small>{goodNetwork ? "Ethereum Sepolia" : "Switch required"}</small></div></div>
        <div className="check"><span className={validRecipient ? "check-good" : "check-bad"}>{validRecipient ? "✓" : "!"}</span><div><b>Recipient</b><small>{validRecipient ? "Address format valid" : "Invalid address"}</small></div></div>
        <div className="check"><span className={enough ? "check-good" : "check-bad"}>{enough ? "✓" : "!"}</span><div><b>Funds + gas</b><small>{enough ? "Enough for amount + reserve" : "Check amount and balance"}</small></div></div>
        <div className="side-note">This demo sends real Sepolia ETH. CryptoPool does not receive or custody your funds.</div>
      </aside>
    </div>
  </div>;
}
'''

          pattern = r'function Trade\(\) \{.*?\n\}\n\nfunction Portfolio'
          if not re.search(pattern, s, flags=re.S):
              raise SystemExit('Trade function block not found')
          s = re.sub(pattern, new_trade + '\nfunction Portfolio', s, count=1, flags=re.S)
          p.write_text(s, encoding='utf-8')

          Path('src/trade-complete.css').write_text(r'''/* Complete Trade flow — public demo only */
.trade-complete{align-items:start}.trade-page .trade-box{padding:24px}.trade-steps{display:flex;gap:10px;align-items:center;padding:0 0 18px;border-bottom:1px solid #202a37;margin-bottom:22px;color:#667589;font-size:9px;font-weight:900;letter-spacing:1.1px}.trade-steps .active{color:#fff}.trade-steps .done{color:#55dca5}.trade-field{margin-bottom:18px}.field-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.field-head label{font-size:10px;font-weight:900;letter-spacing:1px;color:#8b99aa;text-transform:uppercase}.field-head>span{font-size:10px;color:#65758a}.field-ok{color:#55dca5!important}.field-bad{color:#ff8b8b!important}.asset-select{display:flex;align-items:center;gap:12px;border:1px solid #273241;background:#0a1017;border-radius:12px;padding:13px}.asset-select strong,.asset-select small{display:block}.asset-select small{color:#667589;margin-top:2px}.field-balance{margin-left:auto;text-align:right}.field-balance span,.field-balance b{display:block}.field-balance span{font-size:9px;color:#667589}.field-balance b{font-size:13px;color:#eaf0f7;margin-top:3px}.max-button{border:0;background:transparent;color:#55dca5;font-size:10px;font-weight:900;cursor:pointer}.large-address-input{width:100%;box-sizing:border-box}.amount-row{position:relative}.trade-amount{width:100%;box-sizing:border-box;padding-right:70px!important}.amount-row>span{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:900;color:#8795a7}.trade-hints{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:#667589;font-size:9px}.trade-network{display:flex;align-items:center;gap:10px;border:1px solid #273241;border-radius:10px;padding:11px 12px;margin:8px 0 14px;background:#0a1017}.trade-network span{color:#667589;font-size:9px;text-transform:uppercase;font-weight:900;letter-spacing:1px}.trade-network strong{font-size:10px}.trade-network button{margin-left:auto;border:0;background:#1c2a3b;color:#b8d0e9;border-radius:7px;padding:7px 9px;font-size:9px;font-weight:900;cursor:pointer}.trade-error{margin:12px 0;padding:11px 12px;border:1px solid #713c46;background:#26151a;border-radius:9px;color:#ffb0b0;font-size:10px;line-height:1.5}.trade-review h2{margin:4px 0 6px;font-size:24px}.trade-review>p{color:#758499;font-size:11px;margin:0 0 18px}.review-badge{font-size:9px;font-weight:900;letter-spacing:1.4px;color:#55dca5;margin-bottom:8px}.review-card{border:1px solid #273241;border-radius:12px;overflow:hidden;background:#0a1017}.review-card>div{display:flex;justify-content:space-between;gap:14px;padding:12px 13px;border-bottom:1px solid #1d2733}.review-card>div:last-child{border-bottom:0}.review-card span{color:#667589;font-size:10px}.review-card b{font-size:11px;color:#eaf0f7;text-align:right}.review-card .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.review-card .review-total{background:#101a24}.review-total b{color:#55dca5}.review-actions{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:14px}.success-icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#123326;color:#55dca5;font-size:22px;font-weight:900;margin-bottom:15px}.hash-card{border:1px solid #273241;border-radius:12px;padding:13px;margin:16px 0;background:#0a1017}.hash-card span,.hash-card small{display:block;color:#667589;font-size:9px}.hash-card a{display:block;color:#a9d5ff;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;margin:8px 0}.hash-card small{color:#55dca5}.trade-side{padding:20px}.side-title{font-size:9px;color:#6f7e91;font-weight:900;letter-spacing:1.5px;margin-bottom:6px}.side-note{margin-top:12px;padding-top:12px;border-top:1px solid #202a37;color:#667589;font-size:9px;line-height:1.55}@media(max-width:900px){.trade-complete{grid-template-columns:1fr}.trade-hints{flex-direction:column;gap:4px}.trade-page .trade-box{padding:18px}.review-actions{grid-template-columns:1fr}.trade-steps{font-size:8px}}
''', encoding='utf-8')

          idx = Path('index.html')
          html = idx.read_text(encoding='utf-8')
          link = '<link rel="stylesheet" href="./src/trade-complete.css?v=1" />'
          if link not in html:
              html = html.replace('</head>', f'  {link}\n  </head>')
          idx.write_text(html, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx src/trade-complete.css index.html
          git diff --cached --quiet && exit 0
          git commit -m "Complete public Trade review and signing flow"
          git push
